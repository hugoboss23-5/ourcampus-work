<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#252924">
  <meta name="description" content="A working preview of the Middle Tennessee campus drone film.">
  <title>Our Campus · Middle Tennessee</title>
  <!--
    built-from:
    - Native HTML5 video element and controls (MDN Web Docs, HTMLVideoElement): https://developer.mozilla.org/en-US/docs/Web/HTML/Element/video
    - Campus viewer quiet chrome and typography palette, copied from campus/viewer/web/style.css (owned source)
    - Persepolis Reimagined title/wordmark and quiet cinematic overlay grammar, campus-specific adaptation from approved screenshots 05, 07, 09, 32
  -->
  <link rel="stylesheet" href="./quiet-chrome.css">
  <link rel="stylesheet" href="./preview.css">
</head>
<body>
  <main class="preview" aria-label="Middle Tennessee campus drone preview">
    <video id="campus-film" class="film" controls autoplay muted loop playsinline preload="metadata"
      poster="./assets/campus-drone-preview-poster.jpg"
      aria-label="Drone preview of the Middle Tennessee campus">
      <source src="./assets/campus-drone-preview.mp4" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>
    <div class="film-shade" aria-hidden="true"></div>
    <div class="pointer-light" aria-hidden="true"></div>

    <header class="masthead">
      <a class="wordmark" href="./" aria-label="Our Campus, home">OUR CAMPUS</a>
      <span class="preview-badge"><span class="badge-dot" aria-hidden="true"></span>WORKING PREVIEW</span>
    </header>

    <section class="hero-copy" aria-labelledby="page-title">
      <p class="eyebrow">CAMPUS DRONE PREVIEW</p>
      <h1 id="page-title">Middle Tennessee</h1>
      <p class="status" id="media-status" role="status" aria-live="polite">Drone preview · muted</p>
    </section>

    <button class="hero-play" id="play-toggle" type="button" aria-label="Play campus preview" aria-pressed="false">
      <span class="play-mark" aria-hidden="true"></span>
      <span class="play-label">Play campus preview</span>
    </button>

    <nav class="control-rail" aria-label="Video actions">
      <button class="rail-button" id="replay" type="button" aria-label="Replay from beginning" title="Replay from beginning">REPLAY</button>
      <button class="rail-button" id="pause-toggle" type="button" aria-label="Pause preview" title="Pause preview">PAUSE</button>
      <button class="rail-button" id="fullscreen" type="button" aria-label="Enter fullscreen" title="Fullscreen">FULL SCREEN</button>
    </nav>

    <p class="control-feedback" id="control-feedback" role="status" aria-live="polite" hidden></p>
    <p class="media-error" id="media-error" role="alert" hidden>Preview video is unavailable. The real campus film will appear here when its file is ready.</p>
  </main>
  <script src="./preview.js" defer></script>
</body>
</html>
